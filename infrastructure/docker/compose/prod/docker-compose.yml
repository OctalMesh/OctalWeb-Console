services:
  console-web:
    build:
      context: ../../../../edge/console-web
      dockerfile: Dockerfile
    container_name: octal-console
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
