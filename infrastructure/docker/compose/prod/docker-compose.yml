services:
  console-web:
    build:
      context: ../../../../edge/console-web
      dockerfile: Dockerfile
    container_name: octal-console
    ports:
      - "3002:3002"
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # Router
      - "traefik.http.routers.octal-console.rule=Host(`console.octalmesh.com`)"
      - "traefik.http.routers.octal-console.entrypoints=websecure"
      - "traefik.http.routers.octal-console.tls=true"
      - "traefik.http.routers.octal-console.tls.certresolver=cloudflare"
      - "traefik.http.routers.octal-console.service=octal-console-service"

      # Service
      - "traefik.http.services.octal-console-service.loadbalancer.server.port=3002"

networks:
  dokploy-network:
    external: true
